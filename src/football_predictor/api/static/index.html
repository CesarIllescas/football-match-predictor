<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Match Predictor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Football Match Predictor</h1>
      <p class="subtitle">National-team models · pre-match features only</p>
    </header>

    <main class="layout">
      <section class="card">
        <h2>Match setup</h2>
        <form id="predict-form" class="form">
          <div class="row two">
            <label>
              Home team
              <input name="home_team" list="team-list" required placeholder="e.g. Japan" autocomplete="off" />
            </label>
            <label>
              Away team
              <input name="away_team" list="team-list" required placeholder="e.g. Tunisia" autocomplete="off" />
            </label>
          </div>
          <datalist id="team-list"></datalist>

          <div class="row two">
            <label>
              Match date
              <input name="date" type="date" required />
            </label>
            <label>
              Tournament
              <select name="tournament" id="tournament-select">
                <option>Friendly</option>
                <option>FIFA World Cup</option>
                <option>FIFA World Cup qualification</option>
                <option>UEFA Euro</option>
                <option>Copa América</option>
                <option>AFC Asian Cup</option>
                <option>African Cup of Nations</option>
                <option>CONCACAF Gold Cup</option>
                <option>UEFA Nations League</option>
              </select>
            </label>
          </div>

          <div class="row two">
            <label>
              Prediction mode
              <select name="prediction_mode">
                <option value="early_prediction">Early (before lineups)</option>
                <option value="lineup_known_prediction">Lineups known</option>
              </select>
            </label>
            <label class="checkbox-label">
              <input name="neutral" type="checkbox" id="neutral-check" />
              Neutral venue
            </label>
          </div>

          <label id="host-wrap" class="hidden">
            Host country
            <input name="host_country" list="team-list" placeholder="Country where the match is played" />
          </label>

          <button type="submit" class="btn primary" id="predict-btn">Predict</button>
        </form>
        <p id="form-error" class="error hidden" role="alert"></p>
      </section>

      <section class="card">
        <h2>Models</h2>
        <p class="muted" id="model-status">Checking model status…</p>
        <button type="button" class="btn secondary" id="retrain-btn">Retrain (build + train)</button>
        <p id="retrain-status" class="retrain-status muted"></p>
      </section>

      <section class="card results-card hidden" id="results">
        <h2>Prediction</h2>
        <p class="fixture" id="fixture-line"></p>

        <div class="outcomes" id="outcomes"></div>

        <div class="metrics-grid">
          <div class="metric">
            <span class="label">λ home</span>
            <span class="value" id="lambda-home">—</span>
          </div>
          <div class="metric">
            <span class="label">λ away</span>
            <span class="value" id="lambda-away">—</span>
          </div>
          <div class="metric">
            <span class="label">Over 2.5</span>
            <span class="value" id="over25">—</span>
          </div>
          <div class="metric">
            <span class="label">BTTS</span>
            <span class="value" id="btts">—</span>
          </div>
        </div>

        <h3>Likely scorelines</h3>
        <ul class="scorelines" id="scorelines"></ul>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
