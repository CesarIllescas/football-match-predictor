[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-match-predictor"
version = "0.1.0"
description = "Production-ready football/soccer match outcome prediction system (national teams first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Football Match Predictor Contributors" }]
keywords = ["football", "soccer", "machine-learning", "elo", "poisson", "predictions"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.0", "catboost>=1.2", "xgboost>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
viz = ["matplotlib>=3.7", "mlflow>=2.9"]
download = ["kaggle>=1.6"]
polars = ["polars>=0.20"]
dev = ["pytest>=7.4"]
all = [
    "lightgbm>=4.0", "catboost>=1.2", "xgboost>=2.0",
    "fastapi>=0.110", "uvicorn>=0.27",
    "matplotlib>=3.7", "mlflow>=2.9",
    "kaggle>=1.6", "polars>=0.20", "pytest>=7.4",
]

[project.scripts]
football-predict = "football_predictor.prediction.predictor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
football_predictor = ["py.typed"]
