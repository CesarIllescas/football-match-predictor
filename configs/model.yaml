# Model-specific hyperparameters. Loaded and merged on top of base.yaml when present.

tabular:
  # Preference order; the first available backend wins.
  backend_preference: ["lightgbm", "catboost", "xgboost", "sklearn"]
  num_target: result_1x2

  lightgbm:
    objective: multiclass
    num_class: 3
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1

  catboost:
    iterations: 600
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 3.0
    loss_function: MultiClass

  xgboost:
    n_estimators: 600
    learning_rate: 0.03
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    objective: "multi:softprob"
    num_class: 3

  sklearn:
    max_iter: 400
    learning_rate: 0.05
    max_depth: 6
    l2_regularization: 0.1

poisson:
  max_goals: 10
  use_dixon_coles: true
  dixon_coles_rho: -0.05  # used only if optimization is skipped

calibration:
  method: isotonic   # one of: isotonic, sigmoid, none
  cv: 3
